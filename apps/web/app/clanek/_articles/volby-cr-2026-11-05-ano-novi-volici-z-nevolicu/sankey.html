<script>(function(){var w=document.querySelector('.dt-sankey:not([data-init])');if(!w)return;w.setAttribute('data-init','1');var sel=w.querySelector('select');sel.addEventListener('change',function(){w.querySelectorAll('svg').forEach(function(s){s.style.display=s.getAttribute('data-kraj')===sel.value?'block':'none'})});w.querySelectorAll('svg').forEach(function(svg){var cur=null;function clear(){svg.classList.remove('sel');svg.querySelectorAll('.on,.p').forEach(function(e){e.classList.remove('on','p')});svg.querySelectorAll('.c').forEach(function(e){e.textContent=''})}function pick(g){var n=g.getAttribute('data-n'),L=g.getAttribute('data-side')==='L',k=n+'|'+(L?'L':'R');clear();if(cur===k){cur=null;return}cur=k;svg.classList.add('sel');g.classList.add('on');svg.querySelectorAll('.l').forEach(function(p){if(p.getAttribute(L?'data-s':'data-t')!==n)return;p.classList.add('on');var o=p.getAttribute(L?'data-t':'data-s');svg.querySelectorAll('.n[data-side="'+(L?'R':'L')+'"]').forEach(function(og){if(og.getAttribute('data-n')===o){og.classList.add('p');og.querySelector('.c').textContent=' · '+p.getAttribute('data-v')}})})}svg.querySelectorAll('.n').forEach(function(g){g.addEventListener('click',function(){pick(g)});g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(g)}})})})})();</script>
