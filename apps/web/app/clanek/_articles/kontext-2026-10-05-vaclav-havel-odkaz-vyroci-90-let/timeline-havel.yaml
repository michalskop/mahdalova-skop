# Vlnovka <RouteTimeline yamlFile="timeline-havel.yaml" /> – Havel: solidarita a její meze.
# Každé tvrzení ověřeno v plném zdroji (rešerše 2026-10-08); zdroj je odkaz přímo v textu.
# Věk: narozen 5. 10. 1936. Fotky: images/timeline/CREDITS.md.
title: "Solidarita a její meze"
subtitle: "Momenty, kdy Václav Havel stál na straně slabších – a kdy jeho humanismus selhal"
theme: trikolora

events:
  - date: "1963-12-03"
    title: "Kulisák, který psal hry"
    thumb: "images/timeline/na-zabradli.jpg"
    thumbAlt: "Divadlo Na zábradlí na Anenském náměstí v Praze"
    thumbCredit: 'Foto: Miloslav Rejha / <a href="https://commons.wikimedia.org/wiki/File:Divadlo_Na_Z%C3%A1bradl%C3%AD.jpg" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a>, <a href="https://creativecommons.org/licenses/by-sa/3.0" target="_blank" rel="noopener noreferrer">CC BY-SA 3.0</a>'
    description: >-
      Kvůli buržoaznímu původu nesměl po roce 1948 studovat. Vyučil se chemickým laborantem a maturitu složil o rok
      později na večerní škole. Od roku 1960 pracoval v pražském Divadle Na zábradlí – nejdřív jako jevištní technik,
      pak jako dramaturg a asistent režie. Ve 27 letech tam měla premiéru jeho Zahradní slavnost, absurdní hra o mladíkovi Hugu Pludkovi, který si osvojí
      úřední frázi tak dokonale, že ho nakonec nepoznají ani vlastní rodiče. Dálkově přitom vystudoval dramaturgii na DAMU.

  - date: "1974–1975"
    title: "Sudy v trutnovském pivovaru"
    thumb: "images/timeline/havel-pivovar-1974.jpg"
    thumbAlt: "Václav Havel nese pytel na dvoře trutnovského pivovaru, 1974"
    thumbPosition: "50% 12%"
    thumbCredit: 'Foto: Karel Hádek, 1974'
    description: >-
      Po okupaci v roce 1968 se stal zakázaným autorem. Bez zaměstnání mu hrozilo stíhání za takzvané příživnictví,
      a tak v roce 1974 nastoupil jako pomocný dělník do pivovaru v Trutnově. Necelý rok tam válel sudy.
      Zkušenost proměnil v aktovku Audience (1975): poprvé v ní vystupuje Ferdinand Vaněk, intelektuál, kterého
      sládek přemlouvá, aby na sebe donášel. Nejznámější je nahrávka, v níž Vaňka mluví Havel a sládka Pavel
      Landovský – v roce 1979 ji vydalo exilové vydavatelství Šafrán. O vzniku hry natočili Jan a Adam Novákovi
      v roce 2009 dokument Občan Havel přikuluje. Nejznámější fotografii Havla z pivovaru pořídil jeho spolupracovník
      Karel Hádek. Režim ho předtím tři a půl roku věznil na plzeňských Borech, v roce 1980 ho připravil
      o občanství a donutil k emigraci.

  - date: "1977-01-06"
    title: "Charta 77 a honička s StB"
    description: >-
      Ve 40 letech spoluformuloval Chartu 77 a stal se jedním z jejích tří prvních mluvčích. Šestého ledna vezl
      s Ludvíkem Vaculíkem a Pavlem Landovským, který řídil, přes 200 podepsaných obálek do Federálního shromáždění.
      StB je v Dejvicích zastavila a všechny tři zatkla. „To nám ten boj za lidská práva pěkně začíná,“ řekl Havel.
      Režim odpověděl Antichartou: 28. ledna ji v Národním divadle podepisovali herci a umělci, podle tehdejších
      oficiálních údajů přes 7 000 lidí,
      mezi nimi i Jiřina Bohdalová.
      Část signatářů později tvrdila, že nevěděla, co podepisuje.

  - date: "1979-10-23"
    title: "Čtyři a půl roku za obranu stíhaných"
    description: >-
      V dubnu 1978 spoluzaložil Výbor na obranu nespravedlivě stíhaných (VONS). Ten dokumentoval a zveřejňoval
      případy lidí, které režim stíhal v rozporu s vlastními zákony.
      Ve 43 letech za to Havla odsoudili za podvracení republiky na 4,5 roku vězení.
      Výkon trestu přerušili v únoru 1983, když onemocněl těžkým zápalem plic. Z vězení psal své ženě Olze – směl
      jeden dopis týdně, zhruba na čtyři strany, a vše četla cenzura. Vedle osobních vzkazů v nich rozvíjel
      filozofické úvahy o smyslu lidské existence a odpovědnosti. Knižně vyšly jako Dopisy Olze v roce 1985
      v exilovém nakladatelství Sixty-Eight Publishers v Torontu.
      Naposledy seděl od ledna do května 1989, půl roku před sametovou revolucí.

  - date: "1990-01-01"
    title: "Amnestie pro 23 tisíc vězňů"
    thumb: "images/timeline/havel-1989.jpg"
    thumbPosition: "50% 30%"
    thumbAlt: "Václav Havel v roce 1989"
    thumbCredit: 'Foto: Jaroslav Krejčí / <a href="https://commons.wikimedia.org/wiki/File:Vaclav_Havel_1989.jpg" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a>'
    description: >-
      Tři dny po zvolení prezidentem řekl v novoročním projevu, že „žijeme ve zkaženém mravním prostředí“,
      a ohlásil širokou amnestii. Z věznic odešlo přes 23 tisíc z 31 tisíc vězňů. Netýkala se vražd, znásilnění
      a zneužití pravomoci.
      Odsouzení podle Havla prošli „pokleslou justicí, jež zkracovala jejich práva“.
      Média pak amnestii spojovala s prudkým růstem kriminality – v roce 1990 evidovala policie zhruba o 80 procent
      víc trestných činů než před listopadem 1989. Veřejná bezpečnost přitom měla podstav lidí i zastaralé vybavení
      a zloděje lákaly byty nově vybavené videi a moderními rádii; na Praze 4 se jen za první čtvrtletí
      ukradlo zhruba třikrát víc aut než před revolucí. <a href="https://ct24.ceskatelevize.cz/clanek/domaci/nove-videoprehravace-malo-policistu-a-amnestie-pred-30-lety-vzkvetala-kriminalita-48956" target="_blank" rel="noopener noreferrer">Studie kriminologů z roku 1991</a> ale ukázala,
      že amnestovaní se podíleli na 8 procentech objasněných trestných činů a amnestie rozhodujícím faktorem nebyla.

  - date: "1990-03-15"
    title: "Odsun Němců nazval mstou"
    description: >-
      Při návštěvě německého prezidenta Richarda von Weizsäckera řekl, že Němci byli po válce vyhnáni
      nikoli na základě prokázané individuální viny, ale jako příslušníci národa – a že šlo o mstu, ne o trest.
      Omluvu napsal už v listopadu 1989, ještě jako soukromá osoba, v dopise Weizsäckerovi. Odsun v něm označil
      za hluboce nemorální čin. Když dopis v lednu 1990 zveřejnilo komunistické Rudé právo, následovalo několik
      veřejných protestů, Havlovu popularitu to ale výrazně nepoškodilo.

  - date: "1990-05-02"
    title: "Konec trestu smrti"
    description: >-
      Federální shromáždění zrušilo trest smrti a nahradilo ho výjimečným trestem. Zákon č. 175/1990 Sb. podepsal
      i Havel a už uložené tresty smrti se změnily na doživotí.
      Poslední poprava v Československu proběhla necelý rok předtím, 8. června 1989 v Bratislavě. Od roku 1918
      bylo popraveno 1 207 lidí.

  - date: "1991"
    title: "Nobelovka pro Su Ťij"
    thumb: "images/timeline/aung-san-suu-kyi.jpg"
    thumbPosition: "50% 30%"
    thumbAlt: "Aun Schan Su Ťij ve Štrasburku v roce 2013"
    thumbCredit: 'Foto: Claude Truong-Ngoc / <a href="https://commons.wikimedia.org/wiki/File:Aung_San_Suu_Kyi_par_Claude_Truong-Ngoc_octobre_2013.jpg" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a>, <a href="https://creativecommons.org/licenses/by-sa/3.0" target="_blank" rel="noopener noreferrer">CC BY-SA 3.0</a>'
    description: >-
      Navrhl na Nobelovu cenu míru barmskou opoziční političku Aun Schan Su Ťij, tehdy v domácím vězení.
      Cenu za rok 1991 dostala „za nenásilný boj za demokracii a lidská práva“ – Havel sám patřil k favoritům.
      Později se stala kontroverzní: jako faktická šéfka vlády nezastavila ani neodsoudila vojenské tažení proti
      Rohingům, po kterém od srpna 2017 uprchlo do Bangladéše přes 700 tisíc lidí, a v roce 2019 obhajovala Myanmar
      před soudem v Haagu proti obvinění z genocidy.
      Amnesty International jí odebrala své ocenění.
      Havel se těchto událostí nedožil.

  - date: "1995-05-13"
    title: "Lety: i Romové byli oběťmi holocaustu"
    thumb: "images/timeline/lety-pamatnik.jpg"
    thumbAlt: "Kamenný památník obětem tábora v Letech u Písku"
    thumbCredit: 'Foto: Michal Ritter / <a href="https://commons.wikimedia.org/wiki/File:Cik%C3%A1nsk%C3%BD_pracovn%C3%AD_a_koncentra%C4%8Dn%C3%AD_t%C3%A1bor_Lety_,_pam%C3%A1tn%C3%ADk_01.jpg" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a>, <a href="https://creativecommons.org/licenses/by-sa/3.0" target="_blank" rel="noopener noreferrer">CC BY-SA 3.0</a>'
    description: >-
      V 58 letech přijel do Let u Písku. V tamním táboře
      v letech 1942–1943 věznili 1 308 Romů, 327 jich zemřelo a přes 500 skončilo v Osvětimi.
      Za jeho přítomnosti odhalili kamenný památník s romsko-českým nápisem „Ma bisteren – nezapomeňte“.
      V projevu řekl, že i Romové byli oběťmi holocaustu, a připomněl, že místo za komunismu zakryl vepřín.
      Velkovýkrmna tam stála ještě dalších 22 let. Stát ji vykoupil až v letech 2017–2018 za zhruba 450 milionů korun,
      zbourala se v roce 2022 a na jaře 2024 se na místě otevřel památník holocaustu Romů a Sintů.

  - date: "1997-12-09"
    title: "Morálka není zbytná"
    thumb: "images/timeline/rudolfinum.jpg"
    thumbAlt: "Průčelí Rudolfina v Praze"
    thumbCredit: 'Foto: Aconcagua / <a href="https://commons.wikimedia.org/wiki/File:Rudolfinum_Prague.jpg" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a>, <a href="https://creativecommons.org/licenses/by-sa/3.0" target="_blank" rel="noopener noreferrer">CC BY-SA 3.0</a>'
    description: >-
      Ve 61 letech, devět dní po demisi Klausovy vlády kvůli aféře s fiktivními sponzory ODS,
      promluvil v Rudolfinu k oběma komorám parlamentu. Řekl, že pod hávem „liberalismu bez přívlastků“ byly
      morálka, slušnost a solidarita odsunuty do „nadstavby“, jako by šlo o ozdobu, bez které se základna obejde –
      „aby se posléze ukázalo, že už není co kořenit: základna je protunelována“. Varoval, že nejúspěšnějšími se
      stávají ti nejnemravnější a největší zisk mají nepotrestatelní zloději. Upozornil také, že ceny rostou
      rychleji než důchody a sociální dávky.

  - date: "1999-04-29"
    title: "Nálety „výlučně humanitární“"
    thumb: "images/timeline/havel-nato-1999.jpg"
    thumbAlt: "Generál Henry Shelton vítá Václava Havla na summitu NATO ve Washingtonu 23. dubna 1999"
    thumbCredit: 'Foto: Helene C. Stikkel, US DoD / <a href="https://commons.wikimedia.org/wiki/File:Defense.gov_News_Photo_990423-D-2987S-037.jpg" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a>, volné dílo'
    description: >-
      Ve 62 letech podpořil 78 dní trvající bombardování Jugoslávie, které NATO kvůli Kosovu vedlo bez mandátu
      Rady bezpečnosti OSN. V textu, který pod jeho jménem otiskly La Repubblica a Le Monde, stojí, že nálety
      nejsou vyvolány hmotným zájmem: „Jejich povaha je výlučně humanitární.“
      V kanadském parlamentu týž den zásah obhajoval tím, že lidská práva stojí nad právy států.
      Kritika míří na chybějící mandát OSN a na civilní oběti: <a href="https://www.hrw.org/reports/2000/nato/Natbm200.htm" target="_blank" rel="noopener noreferrer">podle Human Rights Watch</a> nálety zabily zhruba
      500 civilistů a NATO v některých případech porušilo mezinárodní humanitární právo.
      Spojení „humanitární bombardování“, které se s ním dodnes pojí, ale nepoužil. V roce 2004 ho označil
      za obskurní a odmítl, že by ho kdy vyslovil: „mám – troufám si tvrdit – vkus“. Samotné nálety hájil i později –
      v roce 2003 v rozhovoru pro kosovskou agenturu KosovaLive řekl, že srbským divadelníkům odpověděl,
      že bombardován je jejich režim, který zabíjí jejich krajany.

  - date: "2000-01-01"
    title: "Hleďme i na druhé"
    description: >-
      V 63 letech v novoročním projevu připomněl, že každý z nás je i obyvatelem Země a nese za její osud díl
      odpovědnosti: „Vím, jak to zní nepopulárně, ale nemohu si pomoct: nejvíc ublížíme sami sobě, když se budeme
      starat jen sami o sebe.“ Pokračoval, že nám nesmí být jedno, co se děje kolem nás.

  - date: "2003-01-30"
    title: "Dopis osmi: podpora války v Iráku"
    description: >-
      Tři dny před koncem mandátu, v 66 letech, podepsal Václav Havel a s ním španělský premiér José María Aznar,
      portugalský premiér José Manuel Durão Barroso, italský premiér Silvio Berlusconi, britský premiér Tony Blair,
      maďarský premiér Péter Medgyessy, polský premiér Leszek Miller a dánský premiér Anders Fogh Rasmussen
      otevřený dopis „Evropa a Amerika musí stát pospolu“. Irácký režim a jeho zbraně hromadného ničení v něm
      označili za zjevnou hrozbu pro světovou bezpečnost.
      Havel byl mezi nimi jediný prezident a podepsal bez vědomí a souhlasu vlády.
      Dopis rozdělil Evropu. V té době se početná skupina zemí z bývalého totalitního bloku ucházela o členství
      v Evropské unii a francouzský prezident Jacques Chirac těm kandidátům, kteří podpořili válku v Iráku, vzkázal,
      že promeškali dobrou příležitost mlčet. Z Dopisu osmi to byly Česko, Polsko a Maďarsko.
      Kritika se opírá hlavně o to, že zbraně hromadného ničení se nenašly: podle zprávy Iraq Survey Group z roku 2004
      neměl Irák žádné zásoby chemických ani biologických zbraní.
      Havel přesto v září 2003 řekl, že invaze „byla morálně ospravedlnitelná“. Podpis vysvětloval časovým tlakem
      a doporučením ministerstva zahraničí.

  - date: "2010-01-06"
    title: "Za Liou Siao-poa a Chartu 08"
    thumb: "images/timeline/liu-xiaobo-oslo-2010.jpg"
    thumbAlt: "Demonstranti s portrétem Liou Siao-poa před čínským velvyslanectvím v Oslu 9. prosince 2010"
    thumbCredit: 'Foto: Bair175 / <a href="https://commons.wikimedia.org/wiki/File:Demonstration_in_front_of_the_Chinese_embassy_in_Oslo_for_Liu_Xiaobo_Dec_9_2010.jpg" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a>'
    description: >-
      Čínská Charta 08 z prosince 2008 navazovala na Chartu 77 – podle Havla si ji
      vzala za vzor.
      Jednoho z jejích autorů, literárního kritika Liou Siao-poa, odsoudili na Vánoce 2009 na 11 let vězení.
      O necelé dva týdny později přinesl tehdy třiasedmdesátiletý Havel s biskupem Václavem Malým a Pavlem Landovským
      na čínské velvyslanectví v Praze dopis za jeho propuštění. Nikdo jim neotevřel, a tak dopis vhodili do schránky.
      Spolu s Desmondem Tutuem pak Lioua nominoval na Nobelovu cenu míru. Získal ji v roce 2010 a předávala se
      prázdné židli. Ve vazbě zůstal až do smrti: rakovinu jater mu diagnostikovali v květnu 2017, v pokročilém
      stadiu. Čína ho nepustila na léčbu do ciziny, přestože němečtí a američtí lékaři, které nemocnice přizvala,
      převoz považovali za možný. Zemřel 13. července 2017 v nemocnici v Šen-jangu, bylo mu 61 let. Podle předsedkyně
      Norského Nobelova výboru Berit Reiss-Andersenové nese čínská vláda za jeho předčasnou smrt
      <a href="https://www.americamagazine.org/politics-society/2017/07/13/china-nobel-peace-prize-winner-dies-state-custody-226483/" target="_blank" rel="noopener noreferrer">těžkou odpovědnost</a>.

  - date: "2011-12-18"
    title: "Odkaz, který přežil spory"
    thumb: "images/timeline/svicky-vaclavak-2011.jpg"
    thumbAlt: "Svíčky a Havlova fotografie s nápisem Děkujeme na Václavském náměstí 19. prosince 2011"
    thumbCredit: 'Foto: David Sedlecký / <a href="https://commons.wikimedia.org/wiki/File:V%C3%A1cl.n%C3%A1m%C4%9Bst%C3%AD_19Dec_2011_(1).jpg" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a>, <a href="https://creativecommons.org/licenses/by-sa/3.0" target="_blank" rel="noopener noreferrer">CC BY-SA 3.0</a>'
    description: >-
      Zemřel na Hrádečku v 75 letech. Jeho jméno nese pražské letiště, budova Evropského parlamentu ve Štrasburku
      i cena Rady Evropy za lidská práva. Knihovna, která nesla jeho jméno, se v září 2026 po sporech
      ve vedení přejmenovala na 1. prezidentská knihovna – Dagmar Havlová jí odvolala souhlas s užíváním jména.
      Licenci k jeho dílu předává Městské knihovně v Praze.
      Na samotném odkazu to nic nemění: <a href="https://stemmark.cz/vaclav-havel-neochvejne-nejlepsim-prezidentem-po-roce-1989-petr-pavel-si-od-minule-mirne-polepsil" target="_blank" rel="noopener noreferrer">v zářijovém průzkumu</a> ho Češi znovu označili za nejlepšího prezidenta
      po roce 1989.
