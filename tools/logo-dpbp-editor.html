<meta charset="UTF-8">
<title>Logo editor — Data for the future PM</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700;900&family=Roboto:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#101432;--red:#de1743;--orange:#f76800;--yellow:#ffcf02;--teal:#1a9fbd;--bg:#f8f6f0;--border:#e0dbd0;}
body{font-family:'Roboto',sans-serif;background:var(--bg);height:100vh;overflow:hidden;}
#app{display:grid;grid-template-columns:1fr 284px;height:100vh;}

/* PREVIEW */
#preview{display:flex;align-items:center;justify-content:center;background:var(--bg);position:relative;padding:16px;transition:background .3s;}
#preview.dark{background:var(--navy);}
#bg-toggle{position:absolute;top:10px;right:10px;background:rgba(100,100,100,.2);border:1.5px solid rgba(0,0,0,.2);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:500;cursor:pointer;color:#333;transition:color .3s,border-color .3s;}
#preview.dark #bg-toggle{color:#fff;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.12);}

/* PANEL */
#panel{background:#fff;border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;}
.ps{padding:12px 14px;border-bottom:1px solid var(--border);}
.plbl{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-bottom:8px;}

/* SCOPE SELECTOR – the key UX element */
.scope-row{display:flex;gap:4px;}
.scope-btn{flex:1;padding:7px 4px;border:1.5px solid var(--border);border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;background:#fff;color:#555;transition:all .15s;text-align:center;}
.scope-btn.on{background:var(--red);color:#fff;border-color:var(--red);}

/* SOLID COLOR */
.crow{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.crow label{font-size:11px;color:#555;width:56px;flex-shrink:0;}
.crow .hex{font-size:11px;font-family:monospace;color:#333;}
.cbox{width:30px;height:24px;border-radius:3px;border:1px solid var(--border);cursor:pointer;flex-shrink:0;transition:outline .1s;}
.cbox:hover{outline:2px solid var(--red);}

/* GRADIENT */
.gradwrap{background:var(--bg);border-radius:5px;padding:10px;}
.gprev{height:14px;border-radius:3px;margin-top:6px;border:1px solid var(--border);}
.arow{display:flex;align-items:center;gap:7px;margin-top:6px;}
.arow label{font-size:11px;color:#555;width:38px;}
.arow input[type=range]{flex:1;accent-color:var(--red);}
.arow span{font-size:11px;font-family:monospace;width:28px;text-align:right;}

/* INDIVIDUAL */
#ind-section .empty{font-size:11px;color:#aaa;font-style:italic;}

/* CONTOUR */
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.toggle{position:relative;width:38px;height:20px;cursor:pointer;}
.toggle input{opacity:0;width:0;height:0;}
.tslider{position:absolute;inset:0;background:#ccc;border-radius:20px;transition:.3s;}
.tslider:before{content:'';position:absolute;width:14px;height:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;}
input:checked+.tslider{background:var(--red);}
input:checked+.tslider:before{transform:translateX(18px);}
#k-ctrl{opacity:.4;pointer-events:none;transition:opacity .2s;}
#k-ctrl.on{opacity:1;pointer-events:auto;}

/* PRESETS */
.preset{display:flex;align-items:center;gap:7px;cursor:pointer;padding:5px 7px;border-radius:4px;border:1.5px solid var(--border);margin-bottom:4px;transition:border-color .15s;}
.preset:hover{border-color:var(--red);}
.pdots{display:flex;gap:3px;}
.pdot{width:12px;height:12px;border-radius:50%;}
.pname{font-size:10.5px;color:#444;font-weight:500;}

/* PALETTE POPUP */
#pal-popup{display:none;position:fixed;z-index:9999;background:#fff;border:1px solid #ddd;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.18);padding:10px 11px;width:240px;max-height:460px;overflow-y:auto;}
#pal-popup.open{display:block;}
.pfam{margin-bottom:6px;}
.pfam-name{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#bbb;margin-bottom:3px;}
.prow{display:grid;grid-template-columns:repeat(10,18px);gap:3px;}
.psw{width:18px;height:18px;border-radius:3px;cursor:pointer;border:1px solid rgba(0,0,0,.07);transition:transform .1s;}
.psw:hover{transform:scale(1.35);outline:2px solid #333;z-index:2;position:relative;}

/* BOTTOM BUTTONS */
.btm-btn{display:block;width:calc(100% - 28px);margin:6px 14px 0;padding:8px;border:none;border-radius:4px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Roboto Slab',serif;}
.btm-btn:hover{opacity:.88;}
</style>
</head>

          <span id="gang-v">135°</span>
        </div>
        <div class="gprev" id="gprev" style="background: linear-gradient(135deg, rgb(222, 23, 67), rgb(255, 207, 2));"></div>
      </div>
    </div>

    <!-- 4. INDIVIDUAL ELEMENT -->
    <div class="ps" id="ind-section">
      <div class="plbl">Individual element</div>
      <div id="ind-info" class="empty">← click on logo element</div>
      <div id="ind-controls" style="display:none">
        <div class="crow" style="margin-top:6px">
          <label>Color</label>
          <div class="cbox" id="ind-color"></div>
          <span class="hex" id="ind-hex">#de1743</span>
        </div>
      </div>
    </div>

    <!-- 5. CONTOUR -->
    <div class="ps">
      <div class="plbl">Contour</div>
      <div class="toggle-row">
        <span style="font-size:11px;font-weight:500">Enable contours</span>
        <label class="toggle"><input type="checkbox" id="k-on" onchange="onContour()"><span class="tslider"></span></label>
      </div>
      <div id="k-ctrl">
        <div class="crow"><label>Width</label><input type="range" id="k-w" min="1" max="8" value="2" step=".5" oninput="document.getElementById('k-wv').textContent=this.value+'px';onContour()"><span class="hex" id="k-wv">2px</span></div>
        <div class="crow"><label>Color</label><div class="cbox" id="k-color" data-color="#1a1a1a" style="background: rgb(26, 26, 26);"></div><span class="hex" id="k-ch">#1a1a1a</span></div>
        <div class="crow"><label style="width:auto;font-size:11px">Same as fill</label><input type="checkbox" id="k-same" onchange="onContour()" style="margin-left:6px;accent-color:var(--red)"></div>
      </div>
    </div>

    <!-- 6. PRESETS -->
    <div class="ps">
      <div class="plbl">Presets</div>
      <div id="presets"><div class="preset"><div class="pdots"><span class="pdot" style="background:#de1743"></span><span class="pdot" style="background:#f76800"></span><span class="pdot" style="background:#ffcf02"></span></div><span class="pname">Flame</span></div><div class="preset"><div class="pdots"><span class="pdot" style="background:#101432"></span><span class="pdot" style="background:#de1743"></span></div><span class="pname">Sunset</span></div><div class="preset"><div class="pdots"><span class="pdot" style="background:#101432"></span><span class="pdot" style="background:#1a9fbd"></span><span class="pdot" style="background:#f8f6f0"></span></div><span class="pname">Ocean</span></div><div class="preset"><div class="pdots"><span class="pdot" style="background:#de1743"></span><span class="pdot" style="background:#6b0820"></span></div><span class="pname">Mono</span></div></div>
    </div>

    <button class="btm-btn" onclick="resetAll()" style="background:var(--bg);border:1.5px solid var(--border);color:var(--navy);margin-top:8px;">↺ Reset</button>
    <button class="btm-btn" onclick="dlEditor()" style="background:var(--teal);color:#fff;margin-top:4px;">⬇ Download editor</button>
    <button class="btm-btn" onclick="dlSVG()" style="background:var(--navy);color:#fff;margin-top:4px;margin-bottom:14px;">⬇ Download SVG</button>
  </div>
</div>

<script>
const C=[[358.4,156.6,40.6],[412.8,347.0,35.3],[340.9,512.7,24.7],[280.6,220.0,24.7],[379.8,253.5,21.2],[311.7,364.6,17.6],[537.3,304.7,17.6],[313.7,292.3,17.6],[449.8,213.0,17.6],[358.4,435.1,15.9],[471.2,424.6,12.3],[525.6,361.1,12.3],[469.2,280.0,12.3],[457.6,138.9,12.3],[412.8,488.0,8.8],[539.2,234.1,8.8]];
const DTP = {
  'Warm': [
    '#ffffff','#fdfbf7','#f8f6f0','#f3f1e9','#eeeae2','#e9e9dd','#e8e8dc','#d4d4c8','#c8c8bc','#bcbcb0',
    '#fffdf0','#fff7d9','#fff0b3','#ffe680','#ffdc33','#ffd519','#ffcf02','#efb704','#bd9103','#a47d03',
    '#fff3e8','#ffe0c7','#ffc89f','#fda668','#ff934d','#ff7f2a','#f76800','#cc5f00','#994800','#663200',
    '#fff0ed','#ffcec6','#ffa99c','#ff7e6e','#ff5c4a','#ff3f30','#e8412c','#c93020','#a32318','#7d1810',
    '#fff4f6','#ffb3c0','#ff8099','#ff4970','#ff1a4a','#f01745','#de1743','#c5143c','#a81134','#8b0e2b',
    '#fbe8eb','#f5c4c9','#efa0af','#e87c91','#d85a74','#bb3a5d','#a03250','#812840','#621d30','#431320',
    '#faf5fc','#f3eaf8','#e0c8ee','#c49ad8','#b57ac8','#b262c0','#9f319e','#6e227d','#522a7a','#351040'
  ],
  'Cool': [
    '#e9ebfa','#c9d0f5','#a9b5f0','#899aeb','#697fe6','#5e66d5','#4a51ab','#383d82','#272a59','#161730',
    '#e9ecf4','#d2d8e9','#bcc4df','#a6b0d4','#8f9dc9','#7889be','#6267a3','#4c4f8e','#2f325c','#101432',
    '#e5fdfc','#b8eff6','#8cdfef','#5fcce6','#33b9d9','#1a9fbd','#0e839e','#06677d','#044d5e','#023440',
    '#e8f9f4','#c2f0e4','#9be8d4','#75dfc4','#4fd6b4','#12b886','#0e926a','#0b6b4e','#084533','#042319',
    '#eaf7d6','#cbeab1','#acde8b','#8dd265','#6ec53f','#639e0a','#507e08','#3d5f06','#2a3f04','#172002',
    '#f5f0eb','#e6d5c3','#d4b89e','#c19a78','#a87d58','#8b6240','#6e4a2c','#53361e','#3b2414','#24150b'
  ]
};

const PRESETS=[
  {n:'Flame',   c:['#de1743','#f76800','#ffcf02'], g:['#de1743','#ffcf02',135]},
  {n:'Sunset',  c:['#101432','#de1743'],           g:['#101432','#de1743',135]},
  {n:'Ocean',   c:['#101432','#1a9fbd','#f8f6f0'], g:['#101432','#1a9fbd',135]},
  {n:'Mono',    c:['#de1743','#6b0820'],            g:['#de1743','#6b0820',135]},
];

// STATE
let st = {
  sil: '#de1743',
  cc: Array(C.length).fill('#de1743'),
  scope: 'all',      // 'all' | 'circles' | 'sil' | null (individual)
  indSel: null,      // null | 'sil' | index
};

// ── HELPERS ──────────────────────────────────
function h2r(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function lerp(a,b,t){return'#'+[0,1,2].map(i=>Math.round(a[i]+(b[i]-a[i])*t).toString(16).padStart(2,'0')).join('');}
function setDot(i,c){st.cc[i]=c;document.getElementById('d'+i).setAttribute('fill',c);}
function setSil(c){st.sil=c;document.getElementById('sil-rect').setAttribute('fill',c);}
function getCbox(id){return document.getElementById(id).dataset.color||'#de1743';}

// ── SCOPE ────────────────────────────────────
function setScope(s){
  st.scope=s;  // always set – no toggle off, always one active
  ['all','circles','sil'].forEach(k=>{
    document.getElementById('sc-'+k).classList.toggle('on', st.scope===k);
  });
}

// ── APPLY COLOR TO SCOPE ─────────────────────
function applyColorToScope(c){
  if(!st.scope) return;
  if(st.scope==='sil'||st.scope==='all') setSil(c);
  if(st.scope==='circles'||st.scope==='all') st.cc.forEach((_,i)=>setDot(i,c));
  syncContour();
}

// ── APPLY GRADIENT TO SCOPE ──────────────────
function applyGradToScope(){
  if(!st.scope) return;
  const cA=getCbox('ga'), cB=getCbox('gb');
  const ang=parseInt(document.getElementById('gang').value)*Math.PI/180;
  const dx=Math.cos(ang), dy=Math.sin(ang);
  const rA=h2r(cA), rB=h2r(cB);
  const els=[];
  if(st.scope==='sil'||st.scope==='all') els.push({type:'sil',cx:200,cy:380});
  if(st.scope==='circles'||st.scope==='all') C.forEach(([cx,cy],i)=>els.push({type:'dot',i,cx,cy}));
  const pr=els.map(e=>e.cx*dx+e.cy*dy);
  const mn=Math.min(...pr),mx=Math.max(...pr),rng=mx-mn||1;
  els.forEach((e,j)=>{
    const col=lerp(rA,rB,(pr[j]-mn)/rng);
    if(e.type==='sil') setSil(col); else setDot(e.i,col);
  });
  syncContour();
}

// ── SOLID COLOR CBOX ─────────────────────────
// When user picks from palette for solid-c, apply immediately
function onSolidPick(c){
  document.getElementById('solid-c').style.background=c;
  document.getElementById('solid-c').dataset.color=c;
  document.getElementById('solid-hex').textContent=c;
  applyColorToScope(c);
}

// ── GRADIENT CONTROLS ────────────────────────
function onGradPick(which, c){
  document.getElementById(which).style.background=c;
  document.getElementById(which).dataset.color=c;
  document.getElementById(which+'-h').textContent=c;
  updGradPreview();
  applyGradToScope();
}
function onAngle(){
  document.getElementById('gang-v').textContent=document.getElementById('gang').value+'°';
  updGradPreview();
  applyGradToScope();
}
function updGradPreview(){
  const a=getCbox('ga'),b=getCbox('gb'),ang=document.getElementById('gang').value;
  document.getElementById('gprev').style.background=`linear-gradient(${ang}deg,${a},${b})`;
}

// ── INDIVIDUAL ELEMENT ───────────────────────
function selectEl(id){
  st.indSel=id;
  // Also sync the scope buttons so the global controls work on the clicked element
  const autoScope = id==='sil' ? 'sil' : 'circles';
  setScope(autoScope);

  const info=document.getElementById('ind-info');
  const ctrl=document.getElementById('ind-controls');
  const col=id==='sil'?st.sil:st.cc[id];
  info.textContent=id==='sil'?'Silhouette selected':`Circle ${id+1} selected`;
  info.style.fontStyle='normal'; info.style.color='#333';
  ctrl.style.display='block';
  document.getElementById('ind-color').style.background=col;
  document.getElementById('ind-color').dataset.color=col;
  document.getElementById('ind-hex').textContent=col;
  // Wire cbox for individual edit
  document.getElementById('ind-color').onclick=(e)=>{
    e.stopPropagation();
    openPalette(document.getElementById('ind-color'),(c)=>{
      document.getElementById('ind-color').style.background=c;
      document.getElementById('ind-color').dataset.color=c;
      document.getElementById('ind-hex').textContent=c;
      if(st.indSel==='sil') setSil(c);
      else if(st.indSel!==null) setDot(st.indSel,c);
      syncContour();
    });
  };
}

// ── CONTOUR ──────────────────────────────────
function onContour(){
  const on=document.getElementById('k-on').checked;
  document.getElementById('k-ctrl').classList.toggle('on',on);
  syncContour();
}
function syncContour(){
  const on=document.getElementById('k-on').checked;
  const w=document.getElementById('k-w').value;
  const same=document.getElementById('k-same').checked;
  const kc=document.getElementById('k-color').dataset.color||'#1a1a1a';
  document.querySelectorAll('.dot').forEach((d,i)=>{
    d.setAttribute('stroke',on?(same?st.cc[i]:kc):'none');
    d.setAttribute('stroke-width',on?w:'0');
  });
  const sp=document.getElementById('sil-stroke');
  sp.setAttribute('stroke',on?(same?st.sil:kc):'none');
  sp.setAttribute('stroke-width',on?(w/0.1):'0');
}

// ── PALETTE POPUP ────────────────────────────
let _palCb=null;
function openPalette(el,cb){
  _palCb=cb;
  const pop=document.getElementById('pal-popup');
  pop.classList.add('open');
  const r=el.getBoundingClientRect();
  let top=r.bottom+4, left=r.left;
  if(left+240>window.innerWidth) left=window.innerWidth-250;
  if(top+460>window.innerHeight) top=r.top-464;
  pop.style.top=top+'px'; pop.style.left=left+'px';
}
function closePalette(){document.getElementById('pal-popup').classList.remove('open');_palCb=null;}
document.addEventListener('click',e=>{
  const pop=document.getElementById('pal-popup');
  if(pop.classList.contains('open')&&!pop.contains(e.target)&&!e.target.classList.contains('cbox'))
    closePalette();
});
function buildPalette(){
  const pop=document.getElementById('pal-popup');
  Object.entries(DTP).forEach(([fam,colors])=>{
    const div=document.createElement('div'); div.className='pfam';
    const lbl=document.createElement('div'); lbl.className='pfam-name'; lbl.textContent=fam;
    const row=document.createElement('div'); row.className='prow';
    colors.forEach(c=>{
      const sw=document.createElement('div'); sw.className='psw';
      sw.style.background=c; sw.title=c;
      sw.onclick=(e)=>{e.stopPropagation();if(_palCb){_palCb(c);closePalette();}};
      row.appendChild(sw);
    });
    div.appendChild(lbl); div.appendChild(row); pop.appendChild(div);
  });
}

// Wire a cbox to open palette with given callback
function wireCbox(id, initColor, cb){
  const el=document.getElementById(id);
  if(!el) return;
  el.style.background=initColor;
  el.dataset.color=initColor;
  el.onclick=(e)=>{e.stopPropagation(); openPalette(el,(c)=>{el.style.background=c;el.dataset.color=c;cb(c);});};
}

// ── PRESETS ──────────────────────────────────
function buildPresets(){
  const cont=document.getElementById('presets');
  PRESETS.forEach(p=>{
    const div=document.createElement('div'); div.className='preset';
    div.innerHTML=`<div class="pdots">${p.c.map(c=>`<span class="pdot" style="background:${c}"></span>`).join('')}</div><span class="pname">${p.n}</span>`;
    div.onclick=()=>{
      // Apply preset gradient regardless of scope setting
      const saved=st.scope; if(!st.scope) st.scope='all';
      document.getElementById('ga').style.background=p.g[0]; document.getElementById('ga').dataset.color=p.g[0]; document.getElementById('ga-h').textContent=p.g[0];
      document.getElementById('gb').style.background=p.g[1]; document.getElementById('gb').dataset.color=p.g[1]; document.getElementById('gb-h').textContent=p.g[1];
      document.getElementById('gang').value=p.g[2];
      document.getElementById('gang-v').textContent=p.g[2]+'°';
      updGradPreview(); applyGradToScope();
      if(!saved) st.scope=null;
    };
    cont.appendChild(div);
  });
}

// ── RESET ────────────────────────────────────
function resetAll(){
  const c='#de1743';
  setSil(c); C.forEach((_,i)=>setDot(i,c));
  st.indSel=null;
  document.getElementById('ind-info').textContent='← click on logo element';
  document.getElementById('ind-info').style.fontStyle='italic';
  document.getElementById('ind-info').style.color='#aaa';
  document.getElementById('ind-controls').style.display='none';
  document.getElementById('k-on').checked=false; onContour();
  wireCbox('solid-c','#de1743',(c)=>{ document.getElementById('solid-hex').textContent=c; applyColorToScope(c); });
  wireCbox('ga','#de1743',(c)=>{ document.getElementById('ga-h').textContent=c; updGradPreview(); applyGradToScope(); });
  wireCbox('gb','#ffcf02',(c)=>{ document.getElementById('gb-h').textContent=c; updGradPreview(); applyGradToScope(); });
}

// ── BG TOGGLE ────────────────────────────────
function toggleBg(){
  const p=document.getElementById('preview'),b=document.getElementById('bg-toggle');
  p.classList.toggle('dark');
  b.textContent=p.classList.contains('dark')?'light bg':'dark bg';
}

// ── DOWNLOAD ─────────────────────────────────
function dlSVG(){
  const svg=document.getElementById('logo-svg').cloneNode(true);
  svg.querySelectorAll('[onclick]').forEach(e=>e.removeAttribute('onclick'));
  svg.removeAttribute('width'); svg.removeAttribute('height');
  const blob=new Blob([svg.outerHTML],{type:'image/svg+xml'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='logo-dpbp.svg';a.click();
}
function dlEditor(){
  const blob=new Blob([document.documentElement.outerHTML],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='logo-dpbp-editor.html';a.click();
}

// ── INIT ─────────────────────────────────────
function init(){
  buildPalette();
  buildPresets();
  wireCbox('solid-c','#de1743',(c)=>{ document.getElementById('solid-hex').textContent=c; applyColorToScope(c); });
  wireCbox('ga','#de1743',(c)=>{ document.getElementById('ga-h').textContent=c; updGradPreview(); applyGradToScope(); });
  wireCbox('gb','#ffcf02',(c)=>{ document.getElementById('gb-h').textContent=c; updGradPreview(); applyGradToScope(); });
  wireCbox('k-color','#1a1a1a',(c)=>{ document.getElementById('k-ch').textContent=c; onContour(); });
  updGradPreview();
  // Apply default flame gradient
  st.scope='all';
  applyGradToScope();
}

init();
</script>
