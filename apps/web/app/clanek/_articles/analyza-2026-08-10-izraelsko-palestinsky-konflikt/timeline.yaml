title: "Izraelsko-palestinský konflikt: od plánu OSN po příměří v Gaze"
subtitle: "Osm desetiletí válek, dohod a příměří, která zastavila boje, ale nechala stát jejich příčiny (1947–2027)"
lastUpdated: "Stav k 10. srpnu 2026"
collapsedYears: []

