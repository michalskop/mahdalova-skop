.parties button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.parties button:focus-visible{outline:2px solid var(--muted);outline-offset:1px}
.stat{font-size:.95rem;min-height:2.9em}
.stat b{font-weight:700}
.mapbox{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;font-size:.85rem;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line)}
.legend svg{display:inline-block;width:auto;vertical-align:middle}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px;
  font-size:.86rem;box-shadow:0 4px 14px rgba(16,20,50,.14);display:none;min-width:170px;font-variant-numeric:tabular-nums}
#tip b{display:block;font-size:.95rem}
</style>

const D = window.DATA, W = 900, PAD = 12;
const fmt = (x) => Math.round(x).toLocaleString("cs-CZ");
const pct = (x) => x.toLocaleString("cs-CZ", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " %";
// projekce stejná jako tečková mapa ČR na coverech (kx = cos 49,8°)
const lons = D.dots.map((d) => d[0]), lats = D.dots.map((d) => d[1]);
const x0 = Math.min(...lons), x1 = Math.max(...lons), y0 = Math.min(...lats), y1 = Math.max(...lats);
const kx = Math.cos(49.8 * Math.PI / 180), sc = (W - 2 * PAD) / ((x1 - x0) * kx), H = Math.round((y1 - y0) * sc + 2 * PAD);
const P = (lo, la) => [PAD + (lo - x0) * kx * sc, PAD + (y1 - la) * sc];

const R100 = 16, rad = (v) => Math.max(1.3, Math.sqrt(v / 100000) * R100);
const svg = document.getElementById("map"), NS = "http://www.w3.org/2000/svg";
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
// podklad: obrys republiky z teček mapy, rozmazaný do jemné plochy
const defs = el("defs", {}); const f = el("filter", { id: "blur" }); f.appendChild(el("feGaussianBlur", { stdDeviation: 6 })); defs.appendChild(f); svg.appendChild(defs);
const land = el("g", { filter: "url(#blur)", fill: "var(--land)" });
const rLand = 0.05 * sc;
for (const [lo, la] of D.dots) { const [x, y] = P(lo, la); land.appendChild(el("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: rLand.toFixed(1) })); }
svg.appendChild(land);
const layer = el("g", {}); svg.appendChild(layer);

let cur = "ANO";
// shoda přísudku: hnutí ANO (s.), STAN (m.), Piráti, Motoristé a skupiny (mn. č.), ostatní strany (ž.)
const ROD = { ANO: "o", STAN: "", Piráti: "i", Motoristé: "i", "nezávislí": "i", "místní a ostatní": "i" };
function draw() {
  layer.textContent = "";
  const c = D.barvy[cur], items = [];
  for (const [kod, o] of Object.entries(D.obce)) {
    const s = o.s[cur]; if (!s) continue;
    items.push([kod, o, s]);
  }
  items.sort((a, b) => b[2][1] - a[2][1]); // velké dospod, malé navrch
  for (const [kod, o, [k, v]] of items) {
    const [x, y] = P(o.x, o.y);
    const a = k > 0
      ? { cx: x.toFixed(1), cy: y.toFixed(1), r: rad(v).toFixed(2), fill: c, "fill-opacity": .85, stroke: "#101432", "stroke-opacity": .35, "stroke-width": .6 }
      : { cx: x.toFixed(1), cy: y.toFixed(1), r: 2.2, fill: "none", stroke: c, "stroke-width": 1.1, "stroke-opacity": .9 };
    const e = el("circle", a); e.dataset.kod = kod; layer.appendChild(e);
  }
  const s = D.souhrn[cur], r = ROD[cur] ?? "a", mn = r === "i";
  const kdo = cur === "nezávislí" ? "Nezávislí" : cur === "místní a ostatní" ? "Místní hnutí a menší strany" : cur;
  document.getElementById("stat").innerHTML =
    `<b>${kdo} kandidoval${r} v ${fmt(s.obci)} obcích</b>, kde žije ${pct(s.pokryti)} voličů. ` +
    `Tam ${mn ? "zastupují" : "zastupuje"} ${pct(s.tam)} voličů, v celém Česku ${pct(s.celkem)}.`;
  for (const b of document.querySelectorAll(".parties button")) b.setAttribute("aria-pressed", b.dataset.p === cur);
  legend(c);
  post();
}
function legend(c) {
  const ring = `<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="4" fill="none" stroke="${c}" stroke-width="1.6"/></svg>`;
  const sizes = [1000, 10000, 100000].map((v) => {
    const r = rad(v), d = Math.ceil(2 * r + 2);
    return `<span style="display:inline-flex;align-items:center;gap:5px"><svg width="${d}" height="${d}" viewBox="0 0 ${d} ${d}"><circle cx="${d / 2}" cy="${d / 2}" r="${r}" fill="${c}" fill-opacity=".85" stroke="#101432" stroke-opacity=".35"/></svg>${fmt(v)}</span>`;
  }).join("");
  document.getElementById("legend").innerHTML =
    `<span>Kolik voličů zastupují zastupitelé strany v obci:</span>${sizes}<span style="display:inline-flex;align-items:center;gap:5px">${ring}kandidovali, ale bez křesla</span><span>Kde puntík chybí, strana nekandidovala.</span><span>Data: volby.gov.cz (komunální volby 2026), výpočet DataTimes.cz</span>`;
}
// přepínač stran
const box = document.getElementById("parties");
for (const p of D.strany) {
  const b = document.createElement("button"); b.type = "button"; b.dataset.p = p;
  b.innerHTML = `<i style="background:${D.barvy[p]}"></i>${p}`;
  b.addEventListener("click", () => { cur = p; draw(); });
  box.appendChild(b);
}
// tooltip
const tip = document.getElementById("tip"), mapbox = svg.parentElement;
svg.addEventListener("mousemove", (ev) => {
  const t = ev.target; if (!t.dataset || !t.dataset.kod) { tip.style.display = "none"; return; }
  const o = D.obce[t.dataset.kod], [k, v] = o.s[cur];
  const kr = k === 0 ? "kandidovali, křeslo nezískali" : `${k.toLocaleString("cs-CZ", { maximumFractionDigits: 1 })} z ${o.m} křesel`;
  tip.innerHTML = `<b>${o.n}</b>${fmt(o.v)} voličů<br>${cur}: ${kr}` + (k > 0 ? `<br>zastupují ${fmt(v)} voličů (${pct(100 * v / o.v)})` : "");
  const r = mapbox.getBoundingClientRect(); let x = ev.clientX - r.left + 14, y = ev.clientY - r.top + 14;
  tip.style.display = "block"; if (x + tip.offsetWidth > r.width) x = ev.clientX - r.left - tip.offsetWidth - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
svg.addEventListener("mouseleave", () => { tip.style.display = "none"; });
const post = () => parent.postMessage({ type: "dt-embed-height", id: "mapa-stran-2026", h: Math.ceil(document.getElementById("wrap").getBoundingClientRect().height) + 8 }, "*");
window.addEventListener("resize", post);
draw();
</script>
