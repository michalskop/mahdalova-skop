<!-- Interactive turnout map (images/ucast-mapa.html, translated copy of the Czech article's map) in an iframe.
     The iframe keeps the map's styles separate from the site; the map reports its own height via postMessage. -->
<div style="margin:24px 0 32px">
  <iframe
    id="dt-ucast-2022-2026"
    src="/a/_articles/czech-elections-2026-10-16-municipal-turnout/images/ucast-mapa.html"
    title="Interactive map: change in turnout in the 2026 Czech municipal elections compared with 2022, by municipality"
    style="display:block;width:100%;height:1400px;border:0;background:transparent"
  ></iframe>
</div>
<script>
  (function () {
    var f = document.getElementById('dt-ucast-2022-2026');
    window.addEventListener('message', function (e) {
      if (!f || e.source !== f.contentWindow || !e.data || e.data.type !== 'dt-embed-height') return;
      f.style.height = e.data.h + 'px';
    });
  })();
</script>
