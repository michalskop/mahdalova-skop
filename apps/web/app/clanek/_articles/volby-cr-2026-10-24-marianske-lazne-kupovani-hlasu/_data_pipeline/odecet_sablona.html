<div id="ml-odecet" style="max-width:760px;margin:0 auto;font-family:'IBM Plex Sans',Arial,sans-serif;color:#101432">
<style>
#ml-odecet .ml-btns{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
#ml-odecet .ml-btns button{flex:1 1 140px;font:600 14px 'IBM Plex Sans',Arial,sans-serif;padding:10px 12px;border:1px solid #bcc4df;background:#fff;color:#101432;border-radius:4px;cursor:pointer}
#ml-odecet .ml-btns button[aria-pressed=true]{background:#de1743;border-color:#de1743;color:#fff}
#ml-odecet .ml-row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:14px;margin:4px 0}
#ml-odecet input[type=range]{width:100%;accent-color:#de1743;margin:6px 0 2px}
#ml-odecet .ml-out{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-top:1px solid #e9ecf4;padding-top:12px;margin-top:10px}
#ml-odecet .ml-big{font:700 40px/1 'IBM Plex Sans',Arial,sans-serif}
#ml-odecet .ml-mid{font:700 28px/1 'IBM Plex Sans',Arial,sans-serif;text-align:right}
#ml-odecet .ml-small{font-size:13px;color:#4c4f8e}
#ml-odecet .ml-kdo{border-left:3px solid #6267a3;padding:4px 0 4px 10px;margin:12px 0 4px;font-size:15px;min-height:1.4em}
#ml-odecet svg text{font-family:'IBM Plex Sans',Arial,sans-serif}
</style>
<div class="ml-btns" role="group" aria-label="Rychlá volba">
  <button type="button" data-n="0">Výsledek voleb</button>
  <button type="button" data-n="N1">Bez 7 voličů</button>
  <button type="button" data-n="N0">Bez 83 voličů</button>
</div>
<div class="ml-row"><label for="ml-range">Počet odečtených voličů (každý = 21 hlasů pro Naše Česko)</label><strong id="ml-n" style="font-size:22px">0</strong></div>
<input id="ml-range" type="range" min="0" max="100" step="1" value="0" aria-describedby="ml-kdo">
<div class="ml-row ml-small"><span>0</span><span>100</span></div>
<div class="ml-out">
  <div><div class="ml-small" id="ml-lab">Skutečný výsledek</div><span class="ml-big" id="ml-m">2</span> <span id="ml-mt">mandáty</span></div>
  <div><div class="ml-mid" id="ml-p">7,40 %</div><div class="ml-small" id="ml-h" style="text-align:right"></div></div>
</div>
<div class="ml-kdo" id="ml-kdo" aria-live="polite"></div>
<svg id="ml-svg" viewBox="0 0 600 260" style="width:100%;height:auto;display:block;margin-top:10px" role="img" aria-label="Podíl hlasů Našeho Česka po odečtení celých lístků: dva mandáty do 6 voličů, jeden od 7, žádný od 83, kdy klesne pod 5 %"></svg>
<script>
(function(){
  var D = /*DATA*/;
  var root = document.getElementById('ml-odecet'); if (!root) return;
  var $ = function(id){ return root.querySelector('#' + id); };
  var NS = 'http://www.w3.org/2000/svg';
  var svg = $('ml-svg'), range = $('ml-range');
  // na mobilu užší viewBox, ať písmo zůstane čitelné
  var W = root.clientWidth && root.clientWidth < 500 ? 360 : 600;
  svg.setAttribute('viewBox', '0 0 ' + W + ' 260');
  var X0 = 44, X1 = W - 10, Y0 = 210, Y1 = 30, PMAX = 8;
  var x = function(n){ return X0 + (X1 - X0) * n / D.max; };
  var y = function(p){ return Y0 - (Y0 - Y1) * p / PMAX; };
  var fmt = function(v, d){ return v.toLocaleString('cs-CZ', {minimumFractionDigits: d || 0, maximumFractionDigits: d || 0}); };
  function el(t, a, txt){ var e = document.createElementNS(NS, t); for (var k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; svg.appendChild(e); return e; }
  // pásma podle počtu mandátů
  var bands = [[0, D.n1, '#fff4f6', '2 mandáty'], [D.n1, D.n0, '#e9ecf4', '1 mandát'], [D.n0, D.max, '#ffffff', 'bez mandátu']];
  bands.forEach(function(b){
    el('rect', {x: x(b[0]), y: Y1 - 18, width: Math.max(0, x(b[1]) - x(b[0])), height: Y0 - Y1 + 18, fill: b[2]});
  });
  // popisky pásem v řádku nad grafem; úzké pásmo (2 mandáty) smí přesáhnout, další popisek se odsune
  var konec = 0;
  bands.forEach(function(b){
    var t = el('text', {x: Math.max(x(b[0]) + 4, konec + 10), y: Y1 - 5, 'font-size': 12, 'font-weight': 600, fill: b[0] === 0 ? '#de1743' : '#4c4f8e'}, b[3]);
    var len = t.getComputedTextLength();
    if (+t.getAttribute('x') + len > X1) { t.setAttribute('x', X1); t.setAttribute('text-anchor', 'end'); }
    konec = +t.getAttribute('x') + len;
  });
  [0, 2, 4, 6, 8].forEach(function(p){
    el('line', {x1: X0, x2: X1, y1: y(p), y2: y(p), stroke: p ? '#e9ecf4' : '#101432', 'stroke-width': p ? 1 : 1.5});
    el('text', {x: X0 - 6, y: y(p) + 4, 'text-anchor': 'end', 'font-size': 12, fill: '#4c4f8e'}, p + ' %');
  });
  el('line', {x1: X0, x2: X1, y1: y(5), y2: y(5), stroke: '#4c4f8e', 'stroke-width': 1.5, 'stroke-dasharray': '5 4'});
  el('text', {x: X1, y: y(5) - 6, 'text-anchor': 'end', 'font-size': 12, 'font-weight': 600, fill: '#4c4f8e'}, 'hranice 5 %');
  [D.n1, D.n0].forEach(function(n){
    el('line', {x1: x(n), x2: x(n), y1: Y1 - 18, y2: Y0, stroke: '#8f9dc9', 'stroke-width': 1, 'stroke-dasharray': '2 3'});
    el('text', {x: x(n), y: Y0 + 34, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 700, fill: '#101432'}, n);
  });
  [0, 25, 50, 75, 100].forEach(function(n){
    el('text', {x: x(n), y: Y0 + 18, 'text-anchor': 'middle', 'font-size': 12, fill: '#4c4f8e'}, n);
  });
  el('text', {x: X1, y: Y0 + 48, 'text-anchor': 'end', 'font-size': 12, fill: '#4c4f8e'}, 'odečtení voliči →');
  el('polyline', {points: D.d.map(function(r){ return x(r.n) + ',' + y(r.p); }).join(' '), fill: 'none', stroke: '#de1743', 'stroke-width': 3});
  var dot = el('circle', {r: 6, fill: '#de1743', stroke: '#fff', 'stroke-width': 2});
  function slovo(m){ return m === 1 ? 'mandát' : (m >= 2 && m <= 4 ? 'mandáty' : 'mandátů'); }
  function set(n){
    var r = D.d[n]; range.value = n;
    $('ml-n').textContent = n;
    $('ml-lab').textContent = n ? 'Po odečtení ' + n + ' ' + (n === 1 ? 'voliče' : 'voličů') : 'Skutečný výsledek';
    $('ml-m').textContent = r.m; $('ml-mt').textContent = slovo(r.m);
    $('ml-p').textContent = fmt(r.p, 2) + ' %';
    $('ml-h').textContent = fmt(r.h) + ' hlasů z ' + fmt(r.c);
    $('ml-kdo').textContent = r.k.length
      ? (r.k.length === 1 ? 'Mandát by místo Našeho Česka získala ' : 'Mandáty by místo Našeho Česka získali ') + r.k.map(function(c){ return c[0] + ' (' + c[1] + ')'; }).join(' a ') + '.'
      : 'Rozdělení mandátů se nemění.';
    dot.setAttribute('cx', x(n)); dot.setAttribute('cy', y(r.p));
    root.querySelectorAll('.ml-btns button').forEach(function(b){ b.setAttribute('aria-pressed', String(+b.dataset.n === n)); });
  }
  root.querySelectorAll('.ml-btns button').forEach(function(b){
    b.dataset.n = b.dataset.n === 'N1' ? D.n1 : b.dataset.n === 'N0' ? D.n0 : b.dataset.n;
    b.addEventListener('click', function(){ set(+b.dataset.n); });
  });
  range.addEventListener('input', function(){ set(+range.value); });
  set(0);
})();
</script>
</div>
