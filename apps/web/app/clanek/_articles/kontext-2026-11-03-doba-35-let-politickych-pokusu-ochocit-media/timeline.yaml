title: "35 let sporů o poplatky za ČT a rozhlas"
events:
  - date: "1994-12-08"
    title: "Klausova vláda: státní rozpočet ohrožuje nezávislost"
    summary: "Vláda ODS, KDU-ČSL a ODA přenesla povinnost platit poplatek z vyhlášky do zákona. Financování ze státního rozpočtu výslovně odmítla jako rozporné s nezávislostí vysílatelů na státu."
    link: "https://www.psp.cz/eknih/1993ps/tisky/t127000.htm"
    linkText: "Důvodová zpráva, sněmovní tisk 1270"

  - date: "1997-05-23"
    title: "Zvýšení napříč stranami, republikáni chtěli víc reklamy"
    summary: "Televizní poplatek stoupl z 50 na 75 korun. Pro bylo 153 poslanců, zdrželi se republikáni Miroslava Sládka a polovina komunistů."
    link: "https://www.psp.cz/sqw/hlasy.sqw?g=9233&o=2"
    linkText: "Hlasování po klubech"

  - date: "2004-06-24"
    title: "Špidlova vláda neuspěla, ODS a KSČM proti"
    summary: "Vládní zvýšení na 100 korun padlo. ODS chtěla, aby ČT nejdřív šetřila, a zároveň navrhovala, aby platily všechny domácnosti. Sněmovně chybělo 15 hlasů."
    link: "https://www.psp.cz/sqw/hlasy.sqw?G=36103"
    linkText: "Hlasování 24. 6. 2004"

  - date: "2005-06-29"
    title: "Poplatek zvedl až poslanecký návrh"
    summary: "Lidovec Jaromír Talíř s poslanci ČSSD a Unie svobody prosadil postupné zvýšení až na 135 korun. ODS se rozdělila 16 ku 16, komunisté byli všichni proti."
    link: "https://www.psp.cz/sqw/hlasy.sqw?G=39660"
    linkText: "Hlasování po klubech"

  - date: "2009-11-05"
    title: "Senátoři ODS chtěli poplatky zrušit"
    summary: "První vážný návrh platit ČT a ČRo z daní. Poplatek byl podle předkladatelů přežitý a asociální, odpůrci varovali před zestátněním. Senát ho vrátil výborům."
    link: "https://www.lupa.cz/clanky/senat-vratil-navrh-na-zruseni-poplatku/"
    linkText: "Lupa.cz"

  - date: "2011-09-06"
    title: "Reklama zmizela z ČT1 a ČT24"
    summary: "Koalice ODS, TOP 09 a VV prosadila konec reklamy na hlavních kanálech ČT. Kampaň za to vedla Nova, poplatek ČT výpadek nevyrovnal."
    link: "https://www.lupa.cz/clanky/poslanci-definitivne-zrusili-reklamu-na-ct-1-ct-24/"
    linkText: "Lupa.cz"

  - date: "2015-03-18"
    title: "Veleba a Zeman: neplatit za „nepravdu“"
    summary: "Senátor Strany práv občanů navrhl osvobodit od poplatku ty, o nichž ČT či ČRo odvysílaly nepravdu. Prezident Zeman zrušení poplatků podpořil, premiér Sobotka ho označil za hrubou chybu. Návrh byl stažen."
    link: "https://ct24.ceskatelevize.cz/clanek/domaci/zeman-by-zrusil-koncesionarske-poplatky-sobotka-je-proti-135545"
    linkText: "ČT24"

  - date: "2017-10-25"
    title: "Okamura: zrušit poplatky, média pod stát"
    summary: "Předseda SPD chce z ČT a ČRo státní příspěvkové organizace. Je to jediný politik, který stejný cíl drží bez přestávky dodnes."
    link: "https://spd.cz/tomio-okamura-prosazuji-zruseni-koncesionarskych-poplatku-ceske-televize-a-ceskeho-rozhlasu/"
    linkText: "spd.cz"

  - date: "2018-06-27"
    title: "Babišova vláda: zachováme stávající úpravu"
    summary: "Programové prohlášení vlády ANO a ČSSD slibovalo zachovat postavení veřejnoprávních médií. V roce 2019 vláda napsala, že poplatky chrání média před výkonnou mocí."
    link: "https://vlada.gov.cz/cz/jednani-vlady/programove-prohlaseni/programove-prohlaseni-vlady-165960/"
    linkText: "Programové prohlášení 2018"

  - date: "2025-03-05"
    title: "První zvýšení po 17 letech"
    summary: "Fialova vláda prosadila televizní poplatek 150 korun a rozhlasový 55 korun, platit mají i majitelé telefonů a počítačů. ANO a SPD obstruovaly."
    link: "https://www.mediaguru.cz/clanky/2025/03/snemovna-schvalila-zvyseni-poplatku-pro-ceskou-televizi-a-cesky-rozhlas/"
    linkText: "MediaGuru"

  - date: "2026-06-15"
    title: "Babišova vláda schválila zrušení poplatků"
    summary: "Návrh ministra Oto Klempíře (Motoristé) dává ČT a ČRo od roku 2027 ze státního rozpočtu 7,8 miliardy korun, zhruba o 15 % méně než z poplatků. Motoristé přitom šli do voleb proti financování ze státního rozpočtu."
    link: "https://www.mediaguru.cz/vlada-schvalila-zruseni-poplatku-pro-ct-a-cro-z-rozpoctu-jim-da-o-1-4-mld-mene"
    linkText: "MediaGuru"

  - date: "2026-10-24"
    title: "První čtení ve 4.36 ráno"
    summary: "Sněmovna poslala návrh do výboru po nočním jednání s omezenou rozpravou. Proti bylo 81 ze 177 přítomných. Zaměstnanci ČT a ČRo vyhlásili na 3. listopadu celodenní stávku."
    link: "https://www.psp.cz/sqw/historie.sqw?t=231&o=10"
    linkText: "Sněmovní tisk 231"
