function getColor(val, min, max) {
  if (currentView === &#x27;praha_2&#x27; &amp;&amp; Number.isFinite(val)) {
    if (val === 0) return &#x27;#173a8a&#x27;;
    const t = Math.max(0, Math.min(1, val / max));
    return `rgb(${Math.round(251 - 51*t)},${Math.round(215 - 160*t)},${Math.round(134 - 102*t)})`;
  }

  if (val === null || val === undefined || isNaN(val)) return &#x27;#64748b&#x27;;
  let t = (val - min) / (max - min || 1);
  t = Math.max(0, Math.min(1, t));
  // Continuous smooth palette: Cool Navy (0.0) -&gt; Cyan -&gt; Amber -&gt; Vermilion Red (1.0)
  if (t &lt; 0.33) {
    const sub = t / 0.33;
    const r = Math.round(30 + sub * 20);
    const g = Math.round(80 + sub * 80);
    const b = Math.round(180 + sub * 40);
    return `rgb(${r},${g},${b})`;
  } else if (t &lt; 0.66) {
    const sub = (t - 0.33) / 0.33;
    const r = Math.round(50 + sub * 190);
    const g = Math.round(160 - sub * 20);
    const b = Math.round(220 - sub * 180);
    return `rgb(${r},${g},${b})`;
  } else {
    const sub = (t - 0.66) / 0.34;
    const r = Math.round(240 + sub * 15);
    const g = Math.round(140 - sub * 90);
    const b = Math.round(40 - sub * 20);
    return `rgb(${r},${g},${b})`;
  }
}

function getBubbleRadius(props, viewKey) {
  const z = map ? map.getZoom() : 12;
  // Reference zoom is 12. Zoom factor shrinks bubbles when zoomed out and expands when zoomed in
  const zoomFactor = Math.pow(1.3, z - 12);
  
  let val = 10;
  let scale = 1.8;

  if (viewKey === &#x27;senate_51&#x27;) {
    val = props.valid || 10;
    scale = 1.6;
  } else if (viewKey === &#x27;kladno&#x27;) {
    val = props.total_marks || 100;
    scale = 0.16;
  } else if (viewKey === &#x27;brno&#x27;) {
    val = props.total_marks || 100;
    scale = 0.14;
  } else {
    // Dense urban districts (Praha 2, Praha 3) with ~15k-40k marks
    val = props.total_marks || 100;
    scale = 0.08;
  }

  // Minimum size scales with zoom so it never over-bloats when zoomed out
  const minRadius = Math.max(3.0, 5.0 * zoomFactor);
  const computed = Math.sqrt(val) * scale * zoomFactor;
  
  return Math.max(minRadius, Math.min(computed, 28));
}

    const pct = p.focus_share !== undefined ? p.focus_share : (p.shares[2] || 0);
    const exp = p.focus_expected !== undefined ? p.focus_expected : (p.expected[2] || &#x27;n/a&#x27;);
    popupContent += `
      Celkem hlasů: ${p.total_marks} (lístků: ${p.valid_ballots})&lt;br&gt;
      • &lt;b&gt;Lidovci a Starostové (č. 2):&lt;/b&gt; ${marks} hlasů (${pct.toFixed(2)} %)&lt;br&gt;
      • Očekávání modelu: ~${exp}
    `;
  } else if (viewKey === &#x27;praha_2&#x27;) {
    const anoVotes = p.focus_votes !== undefined ? p.focus_votes : (p.votes[22] || 0);
    const anoShare = p.focus_share !== undefined ? p.focus_share : (p.shares[22] || 0);
    const anoExp = p.focus_expected !== undefined ? p.focus_expected : (p.expected[22] || &#x27;n/a&#x27;);
    popupContent += `
      Celkem hlasů: ${p.total_marks} (lístků: ${p.valid_ballots})&lt;br&gt;
      • &lt;b&gt;ANO 2011 (č. 22):&lt;/b&gt; ${anoVotes} hlasů (${anoShare.toFixed(2)} %)&lt;br&gt;
      • Očekávání modelu: ~${anoExp}
    `;
  } else if (viewKey === &#x27;praha_3&#x27;) {
    const spoluVotes = p.focus_votes !== undefined ? p.focus_votes : (p.votes[12] || 0);
    const spoluShare = p.focus_share !== undefined ? p.focus_share : (p.shares[12] || 0);
    const spoluExp = p.focus_expected !== undefined ? p.focus_expected : (p.expected[12] || &#x27;n/a&#x27;);
    popupContent += `
      Celkem hlasů: ${p.total_marks} (lístků: ${p.valid_ballots})&lt;br&gt;
      • &lt;b&gt;SPOLU pro Prahu (č. 12):&lt;/b&gt; ${spoluVotes} hlasů (${spoluShare.toFixed(2)} %)&lt;br&gt;
      • Očekávání modelu: ~${spoluExp}
    `;
  }
  return popupContent;
}

function renderCurrentLayer(autoFit = false) {
  if (geoLayer) map.removeLayer(geoLayer);
  const cfg = getMetricConfig();

  if (displayMode === &#x27;bubble&#x27;) {
    const markers = [];
    currentStations.forEach(st =&gt; {
      const pos = st.pos;
      if (!pos) return;
      
      const val = getFeatureValue(st, currentView);
      const fillColor = getColor(val, cfg.min, cfg.max);
      const radius = getBubbleRadius(st, currentView);
      
      // Clean neutral subtle border on all bubbles - let the data speak for itself!
      const marker = L.circleMarker(pos, {
        radius: radius,
        fillColor: fillColor,
        fillOpacity: 0.82,
        color: &#x27;#ffffff&#x27;,
        weight: 1.0
      });
      marker.stationData = st; if (st.is_focus) marker.bindTooltip(st.name || (&#x27;Okrsek &#x27; + st.st), {permanent:true, direction:&#x27;right&#x27;, offset:[6,0]});
      
      marker.bindPopup(getPopupContent(st, currentView));
      markers.push(marker);
    });
    
    geoLayer = L.featureGroup(markers).addTo(map);
  } else {
    const features = [];
    currentStations.forEach(st =&gt; {
      if (st.geom) {
        features.push({
          type: &quot;Feature&quot;,
          properties: st,
          geometry: st.geom
        });
      }
    });

    geoLayer = L.geoJSON({ type: &quot;FeatureCollection&quot;, features: features }, {
      style: (feat) =&gt; {
        const val = getFeatureValue(feat.properties, currentView);
        return {
          fillColor: getColor(val, cfg.min, cfg.max),
          fillOpacity: 0.65,
          color: &#x27;#334155&#x27;,
          weight: 1.0
        };
      },
      onEachFeature: (feature, layer) =&gt; {
        layer.bindPopup(getPopupContent(feature.properties, currentView));
      }
    }).addTo(map);
  }

  if (autoFit &amp;&amp; geoLayer &amp;&amp; geoLayer.getBounds &amp;&amp; geoLayer.getBounds().isValid()) {
    map.fitBounds(geoLayer.getBounds(), { padding: [30, 30] });
  }
}


function updateLegend() {
  const cfg = getMetricConfig();
  if (currentView === &#x27;praha_2&#x27;) {
    document.getElementById(&#x27;legend&#x27;).innerHTML = `&lt;strong&gt;${cfg.title}&lt;/strong&gt;&lt;div style=&quot;margin-top:8px&quot;&gt;&lt;span style=&quot;display:inline-block;width:12px;height:12px;background:#173a8a;border-radius:50%;margin-right:6px&quot;&gt;&lt;/span&gt;0 % (žádné hlasy)&lt;/div&gt;&lt;div class=&quot;gradient&quot; style=&quot;background:linear-gradient(to right,rgb(251,215,134),rgb(200,55,32))&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ticks&quot;&gt;&lt;span&gt;Více než 0 %&lt;/span&gt;&lt;span&gt;${cfg.max} %&lt;/span&gt;&lt;/div&gt;&lt;small&gt;Velikost bubliny: celkový počet hlasů v okrsku.&lt;/small&gt;`;
    return;
  }
  document.getElementById(&#x27;legend&#x27;).innerHTML = `&lt;strong&gt;${cfg.title.replace(&#x27;Podíl &#x27;, &#x27;&#x27;)}&lt;/strong&gt;&lt;div class=&quot;gradient&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ticks&quot;&gt;&lt;span&gt;${cfg.min} %&lt;/span&gt;&lt;span&gt;${cfg.max} %&lt;/span&gt;&lt;/div&gt;&lt;small&gt;Velikost bubliny: celkový počet hlasů v okrsku.&lt;/small&gt;`;
}
map = L.map(&#x27;map&#x27;, {scrollWheelZoom: false, dragging: !L.Browser.mobile});
L.tileLayer(&#x27;https://tile.openstreetmap.org/{z}/{x}/{y}.png&#x27;, {maxZoom:19, attribution:&#x27;&amp;copy; &lt;a href=&quot;https://www.openstreetmap.org/copyright&quot;&gt;OpenStreetMap&lt;/a&gt;&#x27;}).addTo(map);
L.control.scale({imperial:false}).addTo(map);
map.on(&#x27;zoomend&#x27;, () =&gt; geoLayer &amp;&amp; geoLayer.eachLayer(layer =&gt; layer.stationData &amp;&amp; layer.setRadius(getBubbleRadius(layer.stationData, currentView))));
document.getElementById(&#x27;metric-select&#x27;).addEventListener(&#x27;change&#x27;, () =&gt; {renderCurrentLayer(false); updateLegend();});
document.getElementById(&#x27;btn-fit&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; map.fitBounds(geoLayer.getBounds(), {padding:[24,24]}));
renderCurrentLayer(true);
if (currentView === &#x27;brno&#x27; || currentView === &#x27;senate_51&#x27;) {
  const focus = currentStations.find(station =&gt; station.is_focus &amp;&amp; station.pos);
  if (focus) map.setView(focus.pos, Math.min(19, map.getZoom() + 2), {animate:false});
}
updateLegend();
new ResizeObserver(() =&gt; map.invalidateSize({pan:false})).observe(document.getElementById(&#x27;map&#x27;));
&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;" style="display:block;width:100%;height:570px;border:1px solid #ddd;border-radius:6px;margin:1.5rem 0;"></iframe>
