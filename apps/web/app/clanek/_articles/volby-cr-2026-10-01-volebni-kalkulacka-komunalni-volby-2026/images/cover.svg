<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- Obálka speciálu Volební kalkulačka: ink blue podklad + logo „favicon 2.0“ s gradientem -->
  <defs>
    <filter id="vk-glow" filterUnits="userSpaceOnUse" x="-300" y="-300" width="1680" height="1680">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="vk-blob" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="vk-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="vk-tile">
      <rect width="128" height="128" rx="32"/>
    </clipPath>
  </defs>

  <rect width="1080" height="1080" fill="#101432"/>

  <!-- Jemná záře v barvách loga -->
  <g filter="url(#vk-glow)" opacity="0.55">
    <circle cx="350" cy="240" r="230" fill="#0070F4"/>
    <circle cx="740" cy="480" r="230" fill="#D04646"/>
  </g>

