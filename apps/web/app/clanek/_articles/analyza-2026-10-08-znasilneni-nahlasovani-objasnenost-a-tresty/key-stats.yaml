label: Znásilnění v Česku v číslech
numbers:
  - value: "11 %"
    title: obětí násilí jde na policii
    description: Podle evropského šetření EU-GBV oznámila policii fyzické nebo sexuální násilí jen asi desetina Češek, které ho zažily. Průzkum IKSP uvádí zhruba 15 procent.
    color: brandNavy
  - value: "52,9 %"
    title: Objasněnost znásilnění v roce 2025
    description: "V roce 2010 policie objasnila tři čtvrtiny případů. Možné vysvětlení poklesu je, že přibývá oznámení, která se dokazují hůř: čin bez viditelného násilí, pachatel ze známých, oznámení s odstupem týdnů."
    color: brand
  - value: "161"
    title: pachatelů šlo v roce 2024 do vězení
    description: Policie ten rok registrovala 1 067 znásilnění, soudy odsoudily 283 lidí.
    color: brandOrange
  - value: "7–10 tisíc"
    title: znásilnění ročně podle hrubého odhadu
    description: Policie loni registrovala 1 086 znásilnění. Pokud se k ní dostane jen desetina až sedmina případů (EU-GBV, IKSP), je skutečných řádově 7 až 10 tisíc ročně. Je to náš hrubý přepočet, ne statistika.
    color: brandNavy
