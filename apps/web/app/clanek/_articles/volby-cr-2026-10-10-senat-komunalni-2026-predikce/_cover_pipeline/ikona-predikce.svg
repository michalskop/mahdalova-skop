<svg xmlns="http://www.w3.org/2000/svg" width="390" height="340" viewBox="0 0 390 340">
  <!-- Ikona predikce: přechod brandRoyalBlue.5 #5e66d5 → brandAmethyst.6 #9f319e (paleta DESIGN.md), ne barvy kalkulačky -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5e66d5"/>
      <stop offset="1" stop-color="#9f319e"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect x="60" y="30" width="250" height="250" rx="48" fill="url(#g)" filter="url(#s)"/>
  <g fill="#fff">
    <rect x="106" y="142" width="34" height="96" rx="5"/>
    <rect x="154" y="104" width="34" height="134" rx="5"/>
    <rect x="202" y="160" width="34" height="78" rx="5"/>
    <rect x="250" y="196" width="30" height="42" rx="5"/>
  </g>
  <polyline points="96,128 170,98 214,142 268,112" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="16 12"/>
  <circle cx="270" cy="110" r="12" fill="#fff"/>
  <rect x="47" y="246" width="276" height="70" rx="35" fill="url(#g)" stroke="#fff" stroke-width="5" filter="url(#s)"/>
  <text x="185" y="294" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-weight="700" font-size="36" letter-spacing="3" fill="#fff">PREDIKCE</text>
</svg>
